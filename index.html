<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🎉 Countdown to 6 January</title>

  <!-- performance hints -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Google / designed fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;500;700&family=Rubik:wght@400;700&display=swap" rel="stylesheet">

  <meta name="theme-color" content="#0b0e12">

  <!-- styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- script (deferred) -->
  <script src="script.js" defer></script>
</head>
<body>
  <div id="app" class="app" data-theme="dark">
    <main class="card" id="card" role="application" aria-label="Countdown card">
      <!-- decorative elements -->
      <div class="decor r1" aria-hidden="true"></div>
      <div class="decor r2" aria-hidden="true"></div>
      <div class="decor r3" aria-hidden="true"></div>
      <div class="decor r4" aria-hidden="true"></div>

      <!-- header -->
      <header class="card-header" id="cardHeader">
        <h1 class="title">
          <span class="spark" aria-hidden="true">✨</span>
          Countdown to 6 January
          <span class="spark" aria-hidden="true">🎆</span>
        </h1>

        <div class="controls" role="toolbar" aria-label="Controls">
          <button id="posterBtn" class="control-btn" title="Toggle poster / UI hide (fullscreen poster)">🖼 Poster</button>

          <button id="themeToggle" class="control-btn" aria-pressed="false" title="Switch to Light mode">🌤 Light</button>

          <button id="fsBtn" class="control-btn primary" aria-pressed="false" title="Toggle fullscreen">⛶ Full</button>
        </div>
      </header>

      <!-- center content -->
      <section class="card-body" id="cardBody">
        <div class="subtitle" id="subtitle">There are</div>

        <div class="count-grid" role="group" aria-label="Countdown values">
          <div class="count-box" aria-live="polite">
            <div class="count-num" id="days">0</div>
            <div class="count-label">Days 🗓️</div>
          </div>

          <div class="count-box" aria-live="polite">
            <div class="count-num" id="hours">00</div>
            <div class="count-label">Hours ⏰</div>
          </div>

          <div class="count-box" aria-live="polite">
            <div class="count-num" id="minutes">00</div>
            <div class="count-label">Minutes ⏱️</div>
          </div>

          <div class="count-box" aria-live="polite">
            <div class="count-num" id="seconds">00</div>
            <div class="count-label">Seconds ⌛</div>
          </div>
        </div>

        <div class="to-text">to</div>
        <div class="big-date" id="bigDate">6 January! 🎉</div>
      </section>

      <!-- footer -->
      <footer class="card-footer" id="cardFooter">
        <div class="footer-left">Auto-updating • Press <kbd>F</kbd> to toggle fullscreen</div>
        <div class="footer-right" id="status" aria-live="polite">Dark mode — saved</div>
      </footer>
    </main>

    <!-- lightweight confetti container -->
    <div id="confetti" aria-hidden="true"></div>
  </div>
</body>
</html>
